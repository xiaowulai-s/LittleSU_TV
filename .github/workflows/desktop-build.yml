name: desktop-build

# 构建桌面端安装包（Windows NSIS，内置 Node sidecar 完整自包含）。
# 触发：推送 v* 标签或在 Actions 页面手动触发。
# 产物自动附加到对应 tag 的 GitHub Release。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 组装内置服务器（next standalone + Node sidecar）
        shell: bash
        run: node scripts/prepare-tauri-server.mjs

      - name: 构建 Windows 安装包
        run: npx tauri build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: littlesu-tv-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 附加安装包到 GitHub Release（仅 tag 构建）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
