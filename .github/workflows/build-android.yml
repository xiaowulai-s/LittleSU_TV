name: android-build

# 构建安卓 APK（连接模式：App 加载 ANDROID_REMOTE_URL 指向的站点）。
# 触发：推送 v* 标签或在 Actions 页面手动触发。
# 远程站点地址在仓库 Variables 里配置：Settings → Secrets and variables → Actions → Variables → ANDROID_REMOTE_URL
# 未配置时回退到 http://127.0.0.1:8080（仅本机调试用）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # 钉住镜像版本：ubuntu-latest 标签滚动曾导致本工作流 startup_failure
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android NDK（runner 已预装 SDK，用绝对路径调 sdkmanager）
        run: |
          ls "$ANDROID_HOME" || echo "ANDROID_HOME 不存在"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.keystore" -alias littlesu -keyalg RSA -keysize 2048 -validity 10000 -storepass littlesu123 -keypass littlesu123 -dname "CN=LittleSU TV"

      - name: 初始化 Android 工程
        run: npx tauri android init
        env:
          LITTLESU_REMOTE_URL: ${{ vars.ANDROID_REMOTE_URL }}

      - name: 允许明文 HTTP（局域网 http:// 站点需要；模板 defaultConfig 默认 false，release 不覆盖）
        run: |
          G=src-tauri/gen/android/app/build.gradle.kts
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' "$G"
          grep -q '\["usesCleartextTraffic"\] = "true"' "$G" && echo "cleartext 已开启"

      - name: 构建 APK（aarch64）
        run: npx tauri android build --apk --target aarch64
        env:
          LITTLESU_REMOTE_URL: ${{ vars.ANDROID_REMOTE_URL }}

      - name: zipalign 并签名（tauri 产物默认未签名，无法直接安装）
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          IN=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" | head -1)
          test -n "$IN"
          "$BT/zipalign" -p 4 "$IN" app-aligned.apk
          "$BT/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/release.keystore" \
            --ks-key-alias littlesu \
            --ks-pass pass:littlesu123 \
            --key-pass pass:littlesu123 \
            --out LittleSU-TV-android.apk app-aligned.apk
          "$BT/apksigner" verify --print-certs LittleSU-TV-android.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: littlesu-tv-android-apk
          path: LittleSU-TV-android.apk
          if-no-files-found: error

      - name: 上传临时 keystore（供首次固化为 Secret）
        if: hashFiles('release.keystore.artifact') != ''
        uses: actions/upload-artifact@v4
        with:
          name: littlesu-tv-keystore
          path: release.keystore.artifact

      - name: 附加 APK 到 GitHub Release（仅 tag 构建）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LittleSU-TV-android.apk
